services:
  db:
    image: postgres:16
    container_name: insight_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insight_pass}
      POSTGRES_DB: ${POSTGRES_DB:-insight_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insight} -d ${POSTGRES_DB:-insight_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
